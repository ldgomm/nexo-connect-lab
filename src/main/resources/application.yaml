ktor:
  deployment:
    port: ${CONNECT_LAB_HTTP_PORT:8282}
  application:
    modules:
      - com.premierdarkcoffee.nexo.connect.lab.infrastructure.config.ConnectLabConfigKt.configureTypedConfiguration
      - com.premierdarkcoffee.nexo.connect.lab.infrastructure.persistence.postgres.PostgresDatabaseLifecycleKt.configurePostgresDatabaseLifecycle
      - com.premierdarkcoffee.nexo.connect.lab.backend.realtime.RealtimeTransportKt.configureAuthenticatedRealtimeTransport
      - com.premierdarkcoffee.nexo.connect.lab.backend.routes.RoutingKt.configureRouting

nexoConnectLab:
  serviceName: ${CONNECT_LAB_SERVICE_NAME:nexo-connect-lab}
  environment: ${CONNECT_LAB_ENVIRONMENT:local}
  httpPort: ${CONNECT_LAB_HTTP_PORT:8282}
  composeProject: ${CONNECT_LAB_COMPOSE_PROJECT:nexo-connect-lab}
  databaseName: ${CONNECT_LAB_DATABASE_NAME:nexo_connect_lab}
  redisNamespace: ${CONNECT_LAB_REDIS_NAMESPACE:nexo-connect-lab}
  mediaBucket: ${CONNECT_LAB_MEDIA_BUCKET:nexo-connect-lab-media}
  identityMode: ${CONNECT_LAB_IDENTITY_MODE:synthetic}
  nexoIntegrationEnabled: ${CONNECT_LAB_NEXO_INTEGRATION_ENABLED:false}
  callsEnabled: ${CONNECT_LAB_CALLS_ENABLED:false}
  e2eeClaim: ${CONNECT_LAB_E2EE_CLAIM:false}
  nexoDbDirectAccess: ${CONNECT_LAB_NEXO_DB_DIRECT_ACCESS:false}
  databaseLifecycleEnabled: ${CONNECT_LAB_DATABASE_LIFECYCLE_ENABLED:false}
