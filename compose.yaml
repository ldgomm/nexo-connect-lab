name: ${CONNECT_LAB_COMPOSE_PROJECT:?CONNECT_LAB_COMPOSE_PROJECT is required}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexo-connect-lab:local
    command:
      - -host=0.0.0.0
    environment:
      CONNECT_LAB_SERVICE_NAME: ${CONNECT_LAB_SERVICE_NAME:?CONNECT_LAB_SERVICE_NAME is required}
      CONNECT_LAB_ENVIRONMENT: ${CONNECT_LAB_ENVIRONMENT:?CONNECT_LAB_ENVIRONMENT is required}
      CONNECT_LAB_HTTP_PORT: ${CONNECT_LAB_HTTP_PORT:?CONNECT_LAB_HTTP_PORT is required}
      CONNECT_LAB_COMPOSE_PROJECT: ${CONNECT_LAB_COMPOSE_PROJECT:?CONNECT_LAB_COMPOSE_PROJECT is required}
      CONNECT_LAB_DATABASE_NAME: ${CONNECT_LAB_DATABASE_NAME:?CONNECT_LAB_DATABASE_NAME is required}
      CONNECT_LAB_REDIS_NAMESPACE: ${CONNECT_LAB_REDIS_NAMESPACE:?CONNECT_LAB_REDIS_NAMESPACE is required}
      CONNECT_LAB_MEDIA_BUCKET: ${CONNECT_LAB_MEDIA_BUCKET:?CONNECT_LAB_MEDIA_BUCKET is required}
      CONNECT_LAB_IDENTITY_MODE: ${CONNECT_LAB_IDENTITY_MODE:?CONNECT_LAB_IDENTITY_MODE is required}
      CONNECT_LAB_NEXO_INTEGRATION_ENABLED: ${CONNECT_LAB_NEXO_INTEGRATION_ENABLED:?CONNECT_LAB_NEXO_INTEGRATION_ENABLED is required}
      CONNECT_LAB_CALLS_ENABLED: ${CONNECT_LAB_CALLS_ENABLED:?CONNECT_LAB_CALLS_ENABLED is required}
      CONNECT_LAB_E2EE_CLAIM: ${CONNECT_LAB_E2EE_CLAIM:?CONNECT_LAB_E2EE_CLAIM is required}
      CONNECT_LAB_NEXO_DB_DIRECT_ACCESS: ${CONNECT_LAB_NEXO_DB_DIRECT_ACCESS:?CONNECT_LAB_NEXO_DB_DIRECT_ACCESS is required}
    ports:
      - "127.0.0.1:${CONNECT_LAB_HTTP_HOST_PORT:?CONNECT_LAB_HTTP_HOST_PORT is required}:8282"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - connect-lab-local

  postgres:
    image: postgres:17.10-alpine3.24
    environment:
      POSTGRES_DB: ${CONNECT_LAB_DATABASE_NAME:?CONNECT_LAB_DATABASE_NAME is required}
      POSTGRES_USER: ${CONNECT_LAB_POSTGRES_USER:?CONNECT_LAB_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${CONNECT_LAB_POSTGRES_PASSWORD:?CONNECT_LAB_POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${CONNECT_LAB_POSTGRES_HOST_PORT:?CONNECT_LAB_POSTGRES_HOST_PORT is required}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - connect-lab-local

  redis:
    image: redis:7.4.10-alpine3.21
    environment:
      CONNECT_LAB_REDIS_PASSWORD: ${CONNECT_LAB_REDIS_PASSWORD:?CONNECT_LAB_REDIS_PASSWORD is required}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$CONNECT_LAB_REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${CONNECT_LAB_REDIS_HOST_PORT:?CONNECT_LAB_REDIS_HOST_PORT is required}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$CONNECT_LAB_REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep -qx PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    networks:
      - connect-lab-local

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CONNECT_LAB_MINIO_ROOT_USER:?CONNECT_LAB_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${CONNECT_LAB_MINIO_ROOT_PASSWORD:?CONNECT_LAB_MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${CONNECT_LAB_MINIO_API_HOST_PORT:?CONNECT_LAB_MINIO_API_HOST_PORT is required}:9000"
      - "127.0.0.1:${CONNECT_LAB_MINIO_CONSOLE_HOST_PORT:?CONNECT_LAB_MINIO_CONSOLE_HOST_PORT is required}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - connect-lab-local

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles:
      - setup
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: "http://${CONNECT_LAB_MINIO_ROOT_USER:?CONNECT_LAB_MINIO_ROOT_USER is required}:${CONNECT_LAB_MINIO_ROOT_PASSWORD:?CONNECT_LAB_MINIO_ROOT_PASSWORD is required}@minio:9000"
    command:
      - ready
      - local
    networks:
      - connect-lab-local

  flyway:
    image: flyway/flyway:13.2.0
    profiles:
      - migration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:${CONNECT_LAB_POSTGRES_JDBC_SCHEME:-postgresql}://postgres:5432/${CONNECT_LAB_DATABASE_NAME:?CONNECT_LAB_DATABASE_NAME is required}
      FLYWAY_USER: ${CONNECT_LAB_POSTGRES_USER:?CONNECT_LAB_POSTGRES_USER is required}
      FLYWAY_PASSWORD: ${CONNECT_LAB_POSTGRES_PASSWORD:?CONNECT_LAB_POSTGRES_PASSWORD is required}
      FLYWAY_CONNECT_RETRIES: "30"
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    command:
      - migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - connect-lab-local

networks:
  # A dedicated normal bridge is intentional. Docker Desktop does not publish
  # host ports for services attached only to an `internal: true` network.
  # Isolation is provided by the project-owned network plus loopback bindings.
  connect-lab-local:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
